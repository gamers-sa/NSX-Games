<!DOCTYPE html>
<html lang="es">

<head>
    <title>Screen Size</title>
    <!-- <link rel="icon" type="/image/png" href="./img/video-game.png" sizes="64x64"> -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            background-color: black;
            background-repeat: no-repeat;
            color: rgb(200, 200, 200);
            font-family: 'Courier New', Courier, monospace;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
            font-size: large;
        }

        .screen {
            background-color: black;
            color: chartreuse;
            border: 1px solid white;
            display: flex;
            width: 10%;
            border-radius: 15px;
            padding: 2%;
            justify-content: center;
        }

        .size1 {
            display: flex;
            flex-direction: column;
            align-items: left;
            text-align: right;
            width: 50%;
            margin-right: 1%;
        }

        .size2 {
            display: flex;
            flex-direction: column;
            align-items: right;
            text-align: right;
            width: 50%;
        }
    </style>

</head>
<p>Screen Size</p><br>
<div class="screen">
    <div class="size1">
        <p class="left">Width: </p>
        <p class="left">Height: </p>
    </div>
    <div class="size2">
        <p class="right" id="width"></p>
        <p class="right" id="height"></p>
    </div>
</div>
<script>

    // const width = document.getElementById("width");
    // const height = document.getElementById("height");
    // width.innerHTML = screen.availWidth + "px.";
    // height.innerHTML = screen.availHeight + "px.";


    const heightOutput = document.querySelector("#height");
    const widthOutput = document.querySelector("#width");

    function updateSize() {
        heightOutput.innerHTML = window.innerHeight + ' px';
        widthOutput.innerHTML = window.innerWidth + ' px';
    }

    updateSize();
    window.addEventListener("resize", updateSize);
</script>
<script>
    console.log(window.location.href)
</script>
</body>

</html>
